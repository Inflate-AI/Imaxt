schema: spec-driven

context: |
  Imaxt publishes one public package: @inflate-ai/imaxt.
  - @inflate-ai/imaxt/core is framework-neutral and owns block data types,
    HTML renderers, styles, and browser hydration helpers.
   - @inflate-ai/imaxt/editor is a React/Lexical editor that reads and writes
     Markdown/GFM plus the established Imaxt MDX block syntax.
   The private editor codec is not a public compiler API. The package excludes
   EditorJS tools and an Astro package. Tests use bun test; DOM-dependent tests
   use happy-dom.

rules:
  tasks:
    - Group tasks by core or editor and pair behavior changes with tests.
